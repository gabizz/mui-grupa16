<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant, modern gradient matching the company's tech profile -->
    <linearGradient id="chameleon-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141f4f" />
      <stop offset="50%" stop-color="#164d66" />
      <stop offset="100%" stop-color="#19857b" />
    </linearGradient>
    
    <!-- Mask to create clean transparent cutouts for the eye and lines -->
    <mask id="chameleon-mask">
      <!-- Keep everything white by default -->
      <rect x="0" y="0" width="100" height="100" fill="#ffffff" />
      
      <!-- Eye cutout: 
           - Outer ring gap (radius 16.5 down to 10 is cutout)
           - Pupil gap (radius 4 and below is cutout) -->
      <circle cx="59" cy="45" r="16.5" fill="#000000" />
      <circle cx="59" cy="45" r="10" fill="#ffffff" />
      <circle cx="59" cy="45" r="4" fill="#000000" />
      
      <!-- Facet separation lines (black lines in the mask to create transparent seams) -->
      <line x1="51" y1="50" x2="5" y2="42" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="38" y2="9" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="62" y2="25" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="95" y2="50" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="74" y2="75" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="46" y2="91" stroke="#000000" stroke-width="1.8" />
      <line x1="51" y1="50" x2="21" y2="67" stroke="#000000" stroke-width="1.8" />
    </mask>
  </defs>

  <!-- Group with the low-poly mask and gradient -->
  <g mask="url(#chameleon-mask)" fill="url(#chameleon-grad)">
    <!-- Facet 1 (Crest Back) -->
    <polygon points="5,42 38,9 51,50" opacity="0.75" />
    
    <!-- Facet 2 (Crest Front) -->
    <polygon points="38,9 62,25 51,50" opacity="0.85" />
    
    <!-- Facet 3 (Forehead / Snout) -->
    <polygon points="62,25 95,50 51,50" opacity="0.95" />
    
    <!-- Facet 4 (Jaw / Snout) -->
    <polygon points="95,50 74,75 51,50" opacity="0.9" />
    
    <!-- Facet 5 (Throat) -->
    <polygon points="74,75 46,91 51,50" opacity="0.8" />
    
    <!-- Facet 6 (Neck Back) -->
    <polygon points="46,91 21,67 51,50" opacity="0.7" />
    
    <!-- Facet 7 (Back Neck Lower) -->
    <polygon points="21,67 5,42 51,50" opacity="0.75" />
  </g>
</svg>